#
# Reference design R2: anomaly detector first. A benign-trained detector screens
# every flow; flows it finds unusual go to a classifier that can clear the alarm.
# Switching the screen off sends every flow to the classifier, so "off" means
# "classifier alone". The controls compare against that classifier.

name: r2-anomaly-first
dataset:
  train: data/train.parquet
  test: data/test.parquet
  label: label
  type: attack_cat
  normal_type: Normal
protocol:
  seeds: [0, 1, 2]
  objective: accuracy
entry: screen
stages:
  screen:
    kind: detector
    fit_on: benign
    pipeline:
      - {class: idslab.prep.Encode, params: {categorical: [proto, service]}}
      - {class: sklearn.preprocessing.StandardScaler}
    candidates:
      - class: sklearn.ensemble.IsolationForest
        params: {n_estimators: 200}
    decision: {budget: [0.1, 0.2, 0.3, 0.4], off: anomalous}
    routes: {anomalous: clear, normal: BENIGN}
  clear:
    kind: classifier
    calibrate: sigmoid
    pipeline:
      - {class: idslab.prep.Encode, params: {categorical: [proto, service]}}
    candidates:
      - class: sklearn.ensemble.RandomForestClassifier
        params: {n_estimators: 200}
    decision: {threshold: 0.5, off: attack}
    routes: {attack: ATTACK, benign: BENIGN}
controls:
  first_stage: clear
  bootstrap: 1000
  frontier_bootstrap: 200
