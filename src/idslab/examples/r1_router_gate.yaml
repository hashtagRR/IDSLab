#
# Reference design R1: entry classifier, router, anomaly gate.
# A flow the entry stage calls attack goes to the router; the router keeps
# confident attacks and sends the rest to a benign-trained detector, which can
# still flag them. Data paths are relative to this file.

name: r1-router-gate
dataset:
  train: data/train.parquet
  test: data/test.parquet
  label: label
  type: attack_cat
  normal_type: Normal
protocol:
  seeds: [0, 1, 2]
  objective: accuracy
entry: binary
stages:
  binary:
    kind: classifier
    calibrate: sigmoid
    pipeline:
      - {class: idslab.prep.Encode, params: {categorical: [proto, service]}}
    candidates:
      - class: sklearn.ensemble.RandomForestClassifier
        params: {n_estimators: 200}
        search: {space: {max_depth: [8, 16, null], min_samples_leaf: [1, 5]}, n_iter: 6, cv: 3}
      - class: sklearn.ensemble.HistGradientBoostingClassifier
    decision: {threshold: 0.5, off: benign}
    routes: {attack: router, benign: BENIGN}
  router:
    kind: classifier
    pipeline:
      - {class: idslab.prep.Encode, params: {categorical: [proto, service]}}
    candidates:
      - class: sklearn.ensemble.RandomForestClassifier
        params: {n_estimators: 200}
    decision: {grid: [0.5, 0.6, 0.7, 0.8, 0.9], off: attack}
    routes: {attack: ATTACK, benign: gate}
  gate:
    kind: detector
    fit_on: benign
    pipeline:
      - {class: idslab.prep.Encode, params: {categorical: [proto, service]}}
      - {class: sklearn.preprocessing.StandardScaler}
    candidates:
      - class: sklearn.ensemble.IsolationForest
        params: {n_estimators: 200}
      - class: sklearn.neighbors.LocalOutlierFactor
        params: {n_neighbors: 50}
    decision: {budget: [0.01, 0.02, 0.05], off: normal}
    routes: {anomalous: ATTACK, normal: BENIGN}
controls:
  bootstrap: 1000
  frontier_bootstrap: 200
