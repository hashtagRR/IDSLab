#
# Release IDSLab from the Actions tab: Run workflow on main, give the version.
#
#   1. test     lint and tests on main, Python 3.10 and 3.13
#   2. prepare  set the version, date the changelog (scripts/release.py), build and check the
#               packages, commit "Release X.Y.Z" and tag vX.Y.Z, kept in a git bundle (not pushed)
#   3. pypi     upload to PyPI with Trusted Publishing (no token); waits for approval when the
#               "pypi" environment requires it
#   4. publish  push the release commit and tag, then the GitHub release with the changelog notes
#               and the packages; Zenodo archives it and gives it a DOI
#
# Nothing reaches GitHub before the PyPI upload has succeeded, so a declined approval or a failed
# upload leaves main and the tags as they were, and the same version can be run again.
#
# One-time setup: on PyPI, project idslab, Publishing: add a GitHub publisher for hashtagRR/IDSLab,
# workflow release.yml, environment pypi. On GitHub, Settings, Environments: create "pypi".
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, three numbers, for example 0.3.1"
        required: true
      title:
        description: "Words after 'IDSLab X.Y.Z: ' in the release title (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Releases run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "run the release workflow on main (this run was started on $GITHUB_REF)" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xgboost,pyod,imbalance]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
      - name: Test
        run: pytest -q

  prepare:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must be new
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists already" >&2
            exit 1
          fi
      - name: Set the version and date the changelog
        run: python scripts/release.py "$VERSION" --notes release-notes.md
      - name: Build and check the packages
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
          test -f "dist/idslab-$VERSION-py3-none-any.whl"
      - name: Commit and tag, in a bundle
        run: |
          git config user.name "hashtagRR"
          git config user.email "52541122+hashtagRR@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag -a "v$VERSION" -m "IDSLab $VERSION"
          git bundle create release.bundle HEAD "refs/tags/v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            release-notes.md
            release.bundle
          if-no-files-found: error

  pypi:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/idslab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TITLE: ${{ inputs.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Push the release tag, then main
        run: |
          git fetch release/release.bundle "refs/tags/v$VERSION:refs/tags/v$VERSION"
          # the tag first: the package is on PyPI already, so the release must go ahead
          git push origin "refs/tags/v$VERSION"
          if ! git push origin "refs/tags/v$VERSION^{commit}:refs/heads/main"; then
            # main moved while the release waited for approval: merge the release into it
            git config user.name "hashtagRR"
            git config user.email "52541122+hashtagRR@users.noreply.github.com"
            git fetch origin main
            git checkout -q -B main origin/main
            if git merge --no-edit "v$VERSION"; then
              git push origin main
            else
              git merge --abort
              echo "::warning::main changed the same lines as the release; merge tag v$VERSION into main by hand"
            fi
          fi
      - name: GitHub release
        run: |
          title="IDSLab $VERSION"
          if [ -n "$TITLE" ]; then title="$title: $TITLE"; fi
          gh release create "v$VERSION" release/dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$title" --notes-file release/release-notes.md --verify-tag
